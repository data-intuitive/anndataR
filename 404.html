<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Preserve full path, query string, and hash when redirecting to new domain
    var newUrl = "https://anndatar.scverse.org" +
                 window.location.pathname +
                 window.location.search +
                 window.location.hash;
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <p>This page has moved to <a href="https://anndatar.scverse.org/">anndatar.scverse.org</a>.</p>
</body>
</html>
